[workspace]
members = ["crates/core", "crates/store", "crates/protocol", "crates/host", "crates/node", "crates/management", "crates/wgfeel", "crates/test-support", "crates/wireguard", "crates/sandbox", "tools/check-blobs"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99"
version = "0.1.0"
license = "AGPL-3.0-only"
publish = false

[workspace.dependencies]
schemars = { version = "1.2.3", features = ["std", "derive"], default-features = false }
serde = { version = "1.0.229", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1.0.154", default-features = false, features = ["std", "raw_value"] }
zeroize = { version = "1.9.2", default-features = false, features = ["alloc"] }
rustix = { version = "1.1.6", default-features = false, features = ["std", "fs", "process"] }
nix = { version = "0.31.4", default-features = false, features = ["signal"] }
gotatun = { version = "0.10.3", default-features = false, features = ["aws-lc-rs"] }
aws-lc-rs = { version = "1.19.0", default-features = false, features = ["non-fips"] }
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
httparse = { version = "1.10.1", default-features = false, features = ["std"] }
smoltcp = { version = "0.14.0", default-features = false, features = ["std", "medium-ip", "proto-ipv4", "proto-ipv6", "socket-tcp", "socket-tcp-reno"] }
hickory-proto = { version = "0.26.3", default-features = false, features = ["std"] }
seccompiler = { version = "0.5.0", default-features = false }
libc = { version = "0.2.189", default-features = false, features = ["std"] }
wgfeel-core = { path = "crates/core" }
wgfeel-store = { path = "crates/store" }
wgfeel-management = { path = "crates/management" }
wgfeel-test-support = { path = "crates/test-support" }
wgfeel-wireguard = { path = "crates/wireguard" }
wgfeel-sandbox = { path = "crates/sandbox" }
wgfeel-protocol = { path = "crates/protocol" }
wgfeel-host = { path = "crates/host" }
wgfeel-node = { path = "crates/node" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
