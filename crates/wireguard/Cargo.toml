[package]
name = "wgfeel-wireguard"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
wgfeel-core.workspace = true
gotatun.workspace = true
# Enforce the approved provider's minimum version and non-FIPS feature.
aws-lc-rs.workspace = true
zeroize.workspace = true

[target.'cfg(all(target_os = "linux", target_arch = "x86_64", target_pointer_width = "64"))'.dependencies]
wgfeel-sandbox.workspace = true
rustix = { workspace = true, features = ["event", "net"] }

[dev-dependencies]
wgfeel-test-support.workspace = true

[[test]]
name = "workers"
path = "tests/workers.rs"
harness = false

[[test]]
name = "local_workers"
path = "tests/local_workers.rs"
harness = false

[lints]
workspace = true
